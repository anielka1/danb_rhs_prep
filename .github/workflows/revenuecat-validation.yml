name: RevenueCat integration validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/subscriptions/**'
      - 'lib/data/subscriptions/**'
      - 'lib/screens/subscription_screen.dart'
      - 'test/subscriptions/**'
      - '.github/workflows/revenuecat-validation.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Export formatter and dependency resolution for review
        run: |
          dart format lib/subscriptions lib/data/subscriptions lib/screens/subscription_screen.dart lib/main.dart lib/screens/exam_overview_screen.dart lib/screens/mock_exam_screen.dart lib/screens/profile_settings_screen.dart test/subscriptions
          git diff --binary > revenuecat-generated.patch
      - uses: actions/upload-artifact@v4
        with:
          name: revenuecat-generated
          path: revenuecat-generated.patch
      - run: flutter analyze
      - run: flutter test test/subscriptions
