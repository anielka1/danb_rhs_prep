name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref (e.g. a new push to the same PR)
# so CI minutes aren't wasted validating a commit that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the exact stable version this repository currently
          # builds and tests against (see `flutter --version` /
          # .metadata). Bump deliberately, not via an unpinned "stable"
          # channel float, so CI can't drift out from under the repo.
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --report only, deliberately not --require-ready: the production
      # diagnostic inventory is intentionally insufficient pending Section
      # 3.5 content review, so --require-ready correctly exits 2 today and
      # must not be a merge gate yet. --report exits 0 as long as the
      # workbench itself is structurally valid, while still visibly
      # printing that diagnostic readiness is FAIL.
      - name: Validate content workbench (report)
        run: dart run tool/validate_candidate_questions.dart --report

      - name: Check for merge-conflict markers / whitespace errors
        run: git diff --check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # gitleaks needs every commit, not just the PR diff, so a
          # secret introduced and later "removed" in an earlier commit on
          # this branch is still caught — a shallow (PR-diff-only) clone
          # would miss that.
          fetch-depth: 0

      # Installed as a pinned, checksum-verified binary from gitleaks'
      # own GitHub Releases (open source, MIT-licensed) rather than a
      # third-party marketplace Action: no telemetry call, no license
      # key, and no code or scan results ever leave this runner.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          chmod +x gitleaks

      # --redact keeps any matched secret's value out of this job's log
      # even when a leak is found; only the rule name, file and line are
      # printed. --exit-code 1 (gitleaks' default on a finding) fails the
      # job, which is the actual PR gate — nothing here uploads a report
      # or the repository content to any external service.
      - name: Scan working tree and full git history for secrets
        run: ./gitleaks detect --source . --redact --exit-code 1
