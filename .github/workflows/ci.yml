name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref (e.g. a new push to the same PR)
# so CI minutes aren't wasted validating a commit that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the exact stable version this repository currently
          # builds and tests against (see `flutter --version` /
          # .metadata). Bump deliberately, not via an unpinned "stable"
          # channel float, so CI can't drift out from under the repo.
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --report only, deliberately not --require-ready: the production
      # diagnostic inventory is intentionally insufficient pending Section
      # 3.5 content review, so --require-ready correctly exits 2 today and
      # must not be a merge gate yet. --report exits 0 as long as the
      # workbench itself is structurally valid, while still visibly
      # printing that diagnostic readiness is FAIL.
      - name: Validate content workbench (report)
        run: dart run tool/validate_candidate_questions.dart --report

      # A bare `git diff --check` right after `actions/checkout` compares
      # the working tree to the index — which are identical immediately
      # after a clean checkout, so it always reports zero findings
      # regardless of the commit's actual content. Diffing the full tree
      # against git's fixed empty-tree object (every line then reads as
      # "added", which is what --check's whitespace/conflict-marker scan
      # actually inspects) makes this check operate on the real checked
      # out content instead of a no-op. See .gitattributes for the
      # Markdown trailing-space exception this depends on.
      - name: Check for merge-conflict markers / whitespace errors
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
