name: update-goldens

# Generate review artifacts for visual changes; never commit baselines automatically.
# The quality job still checks committed baselines independently.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'lib/screens/**'
      - 'lib/widgets/**'
      - 'lib/theme/**'
      - 'test/golden/**'
      - '.github/workflows/update-goldens.yml'

permissions:
  contents: read

jobs:
  update-goldens:
    name: update-goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the exact same version as ci.yml's `quality` job —
          # deliberately kept in sync with that pin, not floated
          # independently, since the whole point of this workflow is
          # producing goldens that job will actually accept.
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate golden images
        run: flutter test --update-goldens test/golden/

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: test/golden/goldens/*.png
          retention-days: 14
