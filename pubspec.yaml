name: danb_rhs_prep
description: "DANB RHS Prep - Ace Your Radiation Health and Safety Exam"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  # Pinned to the last release line before drift 2.32 moved to sqlite3 ^3.x,
  # which in turn moved to Dart's native-assets/hooks build system
  # (package:sqlite3's own README: "Not used anymore, update to version 3.x
  # of package:sqlite3 instead" is about sqlite3_flutter_libs 0.6.0+eol, the
  # *other* half of that same migration). Native-assets is still young
  # enough, and this repo's CI/build matrix (pinned Flutter 3.41.2 on
  # ubuntu-latest for `quality`, macos-latest for `ios-build`) untested
  # enough against it, that the well-proven plugin-based bundling
  # (sqlite3_flutter_libs 0.5.x, standard Android AAR / iOS CocoaPods) is
  # the safer choice today. Revisit deliberately, not via an unpinned
  # upgrade, once native-assets is a settled default for this Flutter
  # version.
  drift: ^2.31.0
  sqlite3: ^2.6.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.6
  path: ^1.9.0
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2
  crypto: ^3.0.3
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/content/danb_rhs/content.json
